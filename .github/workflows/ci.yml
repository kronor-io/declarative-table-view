name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned via .nvmrc rather than lts/*: Node 24 carries a V8 GC bug
      # (ClearStaleLeftTrimmedPointerVisitor) that segfaults the Jest run
      # intermittently. Node 22 is unaffected.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test-unit:all

      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps

      # - name: Run Playwright tests
      #   run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/dtv/playwright-report/
          retention-days: 30
